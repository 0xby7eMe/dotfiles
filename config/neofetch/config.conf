# neofetch — monochrome, to match kitty/starship/quickshell.
# The cat lives in cat.txt (from 0xby7eMe/components/tools/AsciiCat.tsx), shaded by glyph density.
# The full stock config is in config.conf.bak.

# 256-colour grays, so they look the same in any terminal.
W=255   # values
L=250   # labels
D=244   # icons, rails
F=240   # section headers

# neofetch runs under LC_ALL=C and its trim collapses runs of spaces, so glyphs are literal
# and padding uses non-breaking spaces.
NBSP=$'\xc2\xa0'

# One row: rail, icon, padded label, value. Built as a single string because prin trims subtitles.
row() {
    local pad="$2" n=${#2}
    while ((n++ < 8)); do pad+="$NBSP"; done
    prin "$(color $D)│ $1$NBSP$NBSP$(color $L)$pad$(color $W)$3"
}
section() {
    prin "$(color $D)╭─ $(color $F)$1 $(color $D)$(printf '─%.0s' $(seq $((30 - ${#1}))))"
}
end() {
    prin "$(color $D)╰─"
}

print_info() {
    prin
    prin "$(color $W)${bold}${USER}${reset}$(color $D) @ $(color $W)${bold}${HOSTNAME:-$(uname -n)}"
    prin

    section "system"
    get_distro;   row "" "os"     "${distro% x86_64}"
    get_kernel;   row "" "kernel" "$kernel"
    get_packages; row "󰏗" "pkgs" "$(sed -E 's/ \(([a-z]+)\)/ \1/g; s/, / · /g' <<< "$packages")"
    get_uptime;   row "󰅐" "uptime" "$uptime"
    end

    section "desktop"
    get_de;       row "" "wm"     "${de:-$XDG_CURRENT_DESKTOP}"
    { pgrep -x quickshell || pgrep -x qs; } >/dev/null && row "󰕮" "bar" "quickshell"
    get_shell;    row "" "shell"  "$shell"
    get_term;     row "" "term"   "$term"
    get_theme;    row "󰉼" "theme" "${theme% \[*}"
    get_icons;    row "󰀻" "icons" "${icons% \[*}"
    end

    section "hardware"
    get_model;    row "󰌢" "host"   "${model#83TN }"
    get_cpu;      row "" "cpu"    "${cpu/ w\/ */}"
    # get_gpu/get_disk print their own lines for multi-device setups, so read these directly.
    local dgpu igpu
    dgpu=$(lspci | grep -iE 'vga|3d' | grep -i nvidia | sed -E 's/.*\[(GeForce[^]]*)\].*/\1/; s/GeForce //; s| Max-Q / Mobile| Mobile|')
    igpu=$(grep -o 'Radeon [0-9]*M' <<< "$cpu")
    row "󰢮" "gpu" "${dgpu}${dgpu:+${igpu:+ · }}${igpu}"
    row "" "memory" "$(awk '/^MemTotal/{t=$2} /^MemAvailable/{a=$2} END{printf "%.1f / %.1f GiB · %d%%", (t-a)/1048576, t/1048576, (t-a)*100/t}' /proc/meminfo)"
    row "󰋊" "disk" "$(df -h / | awk 'NR==2{printf "%s / %s · %s", $3, $2, $5}')"
    end

    prin
    prin "$(for c in 236 238 240 242 244 246 248 250 252 254 255; do printf '\e[38;5;%sm● ' $c; done)"
}

title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="off"
os_arch="off"
uptime_shorthand="tiny"
package_managers="on"
shell_path="off"
shell_version="off"
cpu_brand="off"
cpu_speed="off"
cpu_cores="off"
de_version="off"

# title, @, underline, subtitle, colon, info
colors=(255 244 244 250 244 255)
bold="on"
underline_enabled="off"
separator=" "
color_blocks="off"

image_backend="ascii"
image_source="$HOME/.config/neofetch/cat.txt"
ascii_colors=(255 250 244 240 0 0)
ascii_bold="off"
gap=4
