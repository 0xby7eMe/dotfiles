# ---------- Font ----------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ---------- Window / blur ----------
window_padding_width       14
confirm_os_window_close    0
hide_window_decorations    yes
background_opacity         0.72
background_blur            64
dynamic_background_opacity yes
remember_window_size       no
initial_window_width       110c
initial_window_height      32c

# ---------- Cursor / scrolling ----------
cursor_shape             block
cursor_blink_interval    0
scrollback_lines         10000
enable_audio_bell        no
copy_on_select           clipboard
cursor_trail 		 10
cursor_trail_decay	 0.3 0.7
cursor_trail_start_threshold 2
cursor_shape 		 block

# ---------- Tabs ----------
tab_bar_edge             bottom
tab_bar_style            powerline
tab_powerline_style      round
tab_title_template       " {index}: {title} "
active_tab_foreground    #000000
active_tab_background    #ffffff
inactive_tab_foreground  #a0a0a0
inactive_tab_background  #1a1a1a
tab_bar_background       #1a1a1a

# ---------- Colors (black & white) ----------
foreground               #ffffff
background               #000000
selection_foreground     #000000
selection_background     #ffffff
cursor                   #ffffff
cursor_text_color        #000000
url_color                #ffffff
active_border_color      #ffffff
inactive_border_color    #333333

color0  #000000
color8  #555555
color1  #8a8a8a
color9  #b0b0b0
color2  #9a9a9a
color10 #c0c0c0
color3  #aaaaaa
color11 #d0d0d0
color4  #bababa
color12 #e0e0e0
color5  #cacaca
color13 #eaeaea
color6  #d4d4d4
color14 #f2f2f2
color7  #e0e0e0
color15 #ffffff

# ---------- Keys ----------
map ctrl+shift+equal     change_font_size all +1.0
map ctrl+shift+minus     change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+t         new_tab_with_cwd
map ctrl+shift+enter     new_window_with_cwd
map ctrl+shift+a>m       set_background_opacity +0.05
map ctrl+shift+a>l       set_background_opacity -0.05
