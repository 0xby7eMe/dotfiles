# Lock screen styled like the Quickshell rice: black glass pills, Manrope,
# Lucide icons, monochrome. Layout follows the macOS lock screen.
# Older versions: hyprlock.conf.bak
$font = Manrope
$icons = lucide
$name = Max

# Quickshell Theme.qml
$glass = rgba(0, 0, 0, 0.72)
$border = rgba(255, 255, 255, 0.07)
$borderHi = rgba(255, 255, 255, 0.14)
$fg = rgba(255, 255, 255, 1.0)
$fgDim = rgba(255, 255, 255, 0.7)
$danger = rgba(255, 107, 107, 1.0)

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Theme.emphasized / Theme.standard
animations {
    enabled = true
    bezier = emphasized, 0.05, 0.7, 0.1, 1
    bezier = standard, 0.2, 0, 0, 1
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4.8, emphasized
    animation = fadeOut, 1, 3, standard
    animation = inputFieldColors, 1, 1.8, standard
    animation = inputFieldFade, 1, 3, standard
    animation = inputFieldWidth, 1, 3, emphasized
    animation = inputFieldDots, 1, 1.8, linear
}

background {
    monitor =
    path = ~/.config/background
    blur_passes = 2
    blur_size = 5
    brightness = 0.6
    contrast = 0.95
    vibrancy = 0.12
}

# ── Top pills (same spot and size as the Quickshell bar) ─────────────
shape {
    monitor =
    size = 100, 30
    rounding = -1
    color = $glass
    border_size = 1
    border_color = $border
    position = 6, -6
    halign = left
    valign = top
}

label {
    monitor =
    text = <span font_family="$icons" size="larger" rise="-1pt"></span>  Locked
    font_size = 9
    font_family = $font SemiBold
    color = $fg
    position = 20, -11
    halign = left
    valign = top
}

shape {
    monitor =
    size = 96, 30
    rounding = -1
    color = $glass
    border_size = 1
    border_color = $border
    position = -6, -6
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-status.sh
    font_size = 9
    font_family = $font SemiBold
    color = $fg
    position = -20, -12
    halign = right
    valign = top
}

# ── Date + clock ─────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 14
    font_family = $font SemiBold
    color = $fgDim
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.35)
    position = 0, -96
    halign = center
    valign = top
}

label {
    monitor =
    text = <span letter_spacing="-3072">$TIME</span>
    font_size = 96
    font_family = $font ExtraBold
    color = $fg
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.3)
    position = 0, -112
    halign = center
    valign = top
}

# ── Avatar + name ────────────────────────────────────────────────────
# Glass circle with initial; drop a photo at ~/.face and point path there.
image {
    monitor =
    path = ~/.config/hypr/assets/avatar.png
    size = 72
    rounding = -1
    border_size = 0
    position = 0, 184
    halign = center
    valign = bottom
}

label {
    monitor =
    text = $name
    font_size = 11
    font_family = $font Bold
    color = $fg
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.35)
    position = 0, 152
    halign = center
    valign = bottom
}

# ── Password pill ────────────────────────────────────────────────────
input-field {
    monitor =
    size = 260, 42
    outline_thickness = 1
    rounding = -1
    inner_color = $glass
    outer_color = $borderHi
    check_color = rgba(255, 255, 255, 0.5)
    fail_color = $danger
    capslock_color = rgba(255, 255, 255, 0.35)
    font_color = $fg
    font_family = $font SemiBold
    placeholder_text = <span foreground="##ffffff70"><span font_family="$icons" rise="-1pt"></span>  Password</span>
    check_text = <span foreground="##ffffffb0">Checking…</span>
    fail_text = <span foreground="##ff6b6b">$FAIL</span>
    fail_timeout = 2000
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    position = 0, 88
    halign = center
    valign = bottom
}

label {
    monitor =
    text = <span font_family="$icons" rise="-1pt"></span>  to unlock
    font_size = 9
    font_family = $font Medium
    color = rgba(255, 255, 255, 0.45)
    position = 0, 58
    halign = center
    valign = bottom
}
