general {
    # Quickshell lock screen (modules/Lock.qml); hyprlock if Quickshell isn't running
    lock_cmd = qs ipc call lock lock || pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# dim the screen after 4 min
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

# lock after 5 min
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# screens off after 6 min
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
